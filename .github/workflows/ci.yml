name: SmartClean Twin CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install ruff==0.15.20 black==26.5.1

      - name: Ruff lint
        run: ruff check shared/ services/ tests/ --ignore E501

      - name: Black format check
        run: black --check shared/ services/ tests/ --line-length 100

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared and service dependencies
        run: |
          pip install pydantic==2.10.6
          pip install paho-mqtt==2.1.0
          pip install fastapi==0.115.8 uvicorn==0.34.0 httpx==0.28.1
          pip install scikit-learn==1.6.1 pandas==2.2.3 numpy==2.2.2 joblib==1.4.2
          pip install influxdb-client==1.47.0
          pip install pytest==8.3.5 pytest-cov==6.1.0

      - name: Run unit + integration + regression tests with coverage
        run: |
          pytest tests/unit/ tests/integration/ tests/regression/ -v \
            --cov=shared --cov=services \
            --cov-report=xml --cov-report=term-missing \
            -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}/shared:${{ github.workspace }}/services/robot-simulator:${{ github.workspace }}/services/state-engine:${{ github.workspace }}/services/ai-service:${{ github.workspace }}/services/command-api:${{ github.workspace }}/services/telemetry-ingestion

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  train-ai-model:
    name: Train & Validate AI Model
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI dependencies
        run: pip install scikit-learn==1.6.1 pandas==2.2.3 numpy==2.2.2 joblib==1.4.2

      - name: Train model and verify accuracy
        run: |
          python services/ai-service/train_model.py
        env:
          MODEL_DIR: /tmp/models
          PYTHONPATH: ${{ github.workspace }}/shared

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build robot-simulator
        run: |
          docker build -f services/robot-simulator/Dockerfile -t smartclean-simulator:test .

      - name: Build telemetry-ingestion
        run: |
          docker build -f services/telemetry-ingestion/Dockerfile -t smartclean-ingestion:test .

      - name: Build state-engine
        run: |
          docker build -f services/state-engine/Dockerfile -t smartclean-state-engine:test .

      - name: Build ai-service
        run: |
          docker build -f services/ai-service/Dockerfile -t smartclean-ai:test .

      - name: Build command-api
        run: |
          docker build -f services/command-api/Dockerfile -t smartclean-command-api:test .

  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: build-docker-images
    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet
