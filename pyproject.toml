[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"

[tool.coverage.run]
source = ["services", "shared"]
omit = ["*/test_*.py", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
